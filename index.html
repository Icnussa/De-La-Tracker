<script>
/* DE LA TRACKER: on-device storage (IndexedDB). Everything stays on this phone. */
(function () {
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open("delatracker", 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("docs")) d.createObjectStore("docs"); if (!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  async function tx(store, mode, fn) {
    const d = await dbp;
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); let out;
      const r = fn(t.objectStore(store)); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = t.onabort = () => rej(t.error);
    });
  }
  const cache = new Map();
  const loaded = (async () => {
    const d = await dbp;
    await new Promise((res, rej) => {
      const t = d.transaction("docs", "readonly"); const c = t.objectStore("docs").openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { cache.set(cur.key, cur.value); cur.continue(); } };
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  })();
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const listeners = new Set();
  const depth = (p) => p.split("/").length;
  const docSnap = (path) => { const v = cache.get(path); return { exists: v !== undefined, id: path.split("/").pop(), data: () => (v === undefined ? undefined : clone(v)) }; };
  function colSnap(cp) {
    const docs = [];
    cache.forEach((v, k) => { if (k.startsWith(cp + "/") && depth(k) === depth(cp) + 1) docs.push({ id: k.split("/").pop(), data: () => clone(v) }); });
    return { docs, size: docs.length, empty: !docs.length };
  }
  function emit(path) {
    setTimeout(() => listeners.forEach((l) => {
      if (l.kind === "doc" && l.path === path) l.cb(docSnap(path));
      if (l.kind === "col" && path.startsWith(l.path + "/") && depth(path) === depth(l.path) + 1) l.cb(colSnap(l.path));
    }), 0);
  }
  async function write(path, val) {
    await loaded;
    if (val === undefined) { await tx("docs", "readwrite", (s) => s.delete(path)); cache.delete(path); }
    else { const v = clone(val); await tx("docs", "readwrite", (s) => s.put(v, path)); cache.set(path, v); }
    emit(path);
  }
  function docRef(path) {
    return {
      id: path.split("/").pop(), path,
      get: async () => { await loaded; return docSnap(path); },
      set: (data) => write(path, data),
      update: async (patch) => { await loaded; const cur = cache.get(path); if (cur === undefined) throw Object.assign(new Error("not found"), { code: "not_found" }); return write(path, { ...cur, ...patch }); },
      delete: () => write(path, undefined),
      onSnapshot(cb, err) { const l = { kind: "doc", path, cb }; listeners.add(l); loaded.then(() => cb(docSnap(path)), (e) => err && err(e)); return () => listeners.delete(l); },
    };
  }
  function colRef(path) {
    return {
      path, doc: (id) => docRef(path + "/" + id),
      onSnapshot(cb, err) { const l = { kind: "col", path, cb }; listeners.add(l); loaded.then(() => cb(colSnap(path)), (e) => err && err(e)); return () => listeners.delete(l); },
    };
  }
  const db = { collection: colRef, doc: docRef };
  const assets = {
    async upload(blob) { const id = "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); await tx("blobs", "readwrite", (s) => s.put(blob, id)); return { id, url: "", sizeBytes: blob.size, contentType: blob.type }; },
    async delete(id) { await tx("blobs", "readwrite", (s) => s.delete(id)); },
    async get(id) { const b = await tx("blobs", "readonly", (s) => s.get(id)); if (!b) throw new Error("missing"); return b; },
  };
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      try {
        const file = new File([blob], filename, { type: blob.type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return { status: "saved" }; }
      } catch (e) { if (e && e.name === "AbortError") return { status: "cancelled" }; }
      const url = URL.createObjectURL(blob); const a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return { status: "saved" };
    },
  };
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  window.claude = { use: async (n) => (n === "db" ? db : n === "assets" ? assets : n === "downloads" ? downloads : null) };
})();
</script>

<style>
/* Layout: phone-style app shell (top bar, scrolling screen, bottom tab bar, floating + button). Screens push in from the right; theme sheet rises from the bottom. Colours are set by the theme picker (defaults below). */
:root {
  --bg: #17181b; --surface: #202226; --raised: #2a2c31; --line: #34363c;
  --fg: #ecebe6; --muted: #9a9890;
  --accent: #f5c518; --accent-ink: #1b1608;
  --danger: #ef6b5b; --soon: #f2b33d; --done: #7f9cf0;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; position: fixed; inset: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- shell ---------- */
.app { position: fixed; top: 0; bottom: 0; left: 0; right: 0; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }
@media (min-width: 600px) { .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
.topbar { display: flex; align-items: center; gap: 12px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.topbar .ttl { flex: 1; min-width: 0; }
.topbar h1 { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; margin: 0; letter-spacing: -0.02em; }
.topbar h1 span { color: var(--accent); }
.topbar .date { font-size: 13px; color: var(--muted); margin-top: 4px; }
.round { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.round svg { width: 20px; height: 20px; }
.round:hover { border-color: var(--muted); }

.main { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-block: 4px 110px; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.screen-title { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 18px 0 10px; }

.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: var(--gut-l); padding-right: var(--gut-r); }
.tab { background: transparent; border: 0; padding: 9px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab .badge { font-family: var(--mono); font-size: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 5px; margin-left: 2px; }

.fab { position: absolute; right: var(--gut-r); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 8px 24px rgb(0 0 0 / 0.35); z-index: 5; }
.fab svg { width: 26px; height: 26px; }
.fab:active { transform: scale(0.96); }

/* ---------- cards & lists ---------- */
.hero { background: var(--accent); color: var(--accent-ink); border-radius: 22px; padding: 18px; border: 0; width: 100%; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.hero .k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.75; }
.hero .s { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; overflow-wrap: anywhere; }
.hero .t { font-weight: 600; opacity: 0.85; overflow-wrap: anywhere; }
.hero .row2 { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: 10px; }
.hero .big { font-family: var(--mono); font-weight: 700; font-size: 34px; line-height: 1; }
.hero .big small { font-size: 14px; font-weight: 500; margin-left: 4px; }
.hero .when2 { font-size: 13px; font-weight: 600; text-align: right; opacity: 0.85; }
.hero.clear { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }

.group-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 22px 2px 8px; display: flex; justify-content: space-between; }
.group-label.late { color: var(--danger); }
.list { display: flex; flex-direction: column; gap: 8px; }
.card { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; width: 100%; text-align: left; }
.card:active { transform: scale(0.99); }
.card .av { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; color: #16151a; }
.card .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .m { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .pdfmark { font-family: var(--mono); font-size: 9px; font-weight: 700; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; color: var(--muted); vertical-align: 2px; }
.when { font-family: var(--mono); font-size: 11px; text-align: right; white-space: nowrap; color: var(--muted); }
.when b { display: block; font-size: 15px; font-weight: 700; color: var(--fg); }
.when.soon b { color: var(--soon); }
.when.late b { color: var(--danger); }
.when.done b { color: var(--done); }
.empty { color: var(--muted); padding: 28px 12px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; }
.empty strong { display: block; color: var(--fg); font-family: var(--display); font-size: 18px; margin-bottom: 4px; }

/* ---------- add chooser + events ---------- */
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; align-items: center; gap: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; width: 100%; }
.choice:hover { border-color: var(--muted); }
.choice > span:last-child { min-width: 0; }
.choice b { display: block; font-size: 16px; }
.choice small { color: var(--muted); font-size: 13px; }
.ch-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.ch-ic svg, .card .av.ev svg { width: 22px; height: 22px; }
.iconpick { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.icb { aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; padding: 0; }
.icb svg { width: 56%; height: 56%; }
.icb[aria-pressed="true"] { border-color: transparent; box-shadow: 0 0 0 2px var(--fg); }
.colpick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.csw { aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 0; padding: 0; position: relative; cursor: pointer; display: block; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.15); }
.csw[aria-pressed="true"]::after, .csw.any.sel::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2.5px solid var(--fg); }
.csw.any { background: conic-gradient(#e5484d, #f2b33d, #b5e04a, #2ec4b6, #4c8dff, #a77bf3, #f06aa8, #e5484d); }
.csw.any input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.label .hint { font-weight: 500; text-transform: none; letter-spacing: 0; font-size: 12px; }
.seg.two.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.subjrows { display: flex; flex-direction: column; gap: 8px; }
.subjrow { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; }
.subjrow > button { display: flex; align-items: center; gap: 12px; width: 100%; background: transparent; border: 0; padding: 12px; text-align: left; font-weight: 700; }
.subjrow > button i { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.15); }
.subjrow > button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subjrow > button small { color: var(--muted); font-weight: 600; }
.subjrow .colpick { padding: 2px 12px 14px; }
.pill svg { width: 13px; height: 13px; }
.sheet .forday { font-size: 13px; color: var(--muted); margin-top: -8px; }

/* ---------- diary ---------- */
.hw { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.tick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; display: grid; place-items: center; padding: 0; color: var(--accent-ink); margin-top: 1px; }
.tick svg { width: 16px; height: 16px; opacity: 0; }
.hw.isdone .tick { background: var(--accent); border-color: var(--accent); }
.hw.isdone .tick svg { opacity: 1; }
.hw-body { background: transparent; border: 0; padding: 0; text-align: left; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.hw-sub { font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; }
.hw-sub i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.hw-sub span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hw-what { color: var(--fg); opacity: 0.9; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hw-dates { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.hw.isdone .hw-sub span, .hw.isdone .hw-what { text-decoration: line-through; opacity: 0.55; }
.hw .when { padding-top: 2px; }
.showmore { background: transparent; border: 0; color: var(--accent); font-weight: 700; padding: 10px 2px; }

/* ---------- grades ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.stat .k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b { font-family: var(--mono); font-weight: 700; font-size: 24px; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }
.stat.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.stat.main .k, .stat.main small { color: inherit; opacity: 0.75; }
.statnote { font-size: 12px; color: var(--muted); margin: 8px 2px 0; }
.terms4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.terms4 div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; text-align: center; min-width: 0; }
.terms4 span { display: block; font-size: 11px; font-weight: 700; color: var(--muted); }
.terms4 b { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.terms4 .cur { border-color: var(--accent); }
.dist { display: flex; flex-wrap: wrap; gap: 6px; }
.dist span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 13px; }
.dist span b { font-family: var(--display); font-size: 15px; margin-right: 4px; }
.subjavg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.subjavg .nm { display: flex; align-items: center; gap: 8px; font-weight: 700; min-width: 0; }
.subjavg .nm i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.subjavg .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subjavg .v { font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.subjavg .v small { display: block; font-family: var(--body); font-weight: 500; font-size: 11px; color: var(--muted); }
.subjavg .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.subjavg .bar i { display: block; height: 100%; border-radius: 3px; }
.gradechips { display: flex; gap: 8px; flex-wrap: wrap; }
.gch { width: 46px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-family: var(--display); font-weight: 800; font-size: 17px; }
.gch[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scoreline { display: flex; gap: 10px; align-items: center; }
.scoreline input { flex: 1; min-width: 0; }
.scoreline .pct { font-family: var(--mono); font-weight: 700; font-size: 18px; min-width: 64px; text-align: right; }

.fpick { position: relative; overflow: hidden; }
.fpick input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }

/* ---------- backup ---------- */
.datasec { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.datasec .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.datasec .btns .btn { text-align: center; cursor: pointer; }
.datasec .msg { font-size: 13px; color: var(--muted); }
.datasec .msg:empty { display: none; }

/* ---------- terms ---------- */
.termstrip { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.termstrip .ts-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.termstrip .ts-top b { font-weight: 700; min-width: 0; }
.termstrip .ts-n { font-family: var(--mono); font-weight: 700; color: var(--accent); white-space: nowrap; }
.termstrip .ts-bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.termstrip .ts-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.termstrip .ts-sub { font-size: 12px; color: var(--muted); }
.dcell .n { position: relative; }
.dcell.tend .n::after, .dcell.tstart .n::after { content: ""; position: absolute; left: 50%; bottom: 1px; transform: translateX(-50%); width: 14px; height: 3px; border-radius: 2px; background: var(--accent); }
.dcell.tstart .n::after { background: var(--muted); }
.dcell.sel.tend .n::after, .dcell.sel.tstart .n::after { background: var(--accent-ink); }
.trow { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px dashed var(--accent); border-radius: 16px; padding: 12px; width: 100%; text-align: left; font-weight: 700; }
.trow svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.trow small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.linkbtn { background: transparent; border: 0; color: var(--accent); font-weight: 700; padding: 10px 2px; }
.yearsw { display: flex; align-items: center; justify-content: center; gap: 16px; }
.yearsw b { font-family: var(--display); font-weight: 800; font-size: 24px; min-width: 70px; text-align: center; }
.termblock { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }

<script>
(function () {
  const TYPES = ["Exam", "Test", "Assignment", "Project", "Presentation", "Practical", "Other"];
  const STATUSES = ["Not started", "In progress", "Submitted", "Marked"];
  const HUES = ["#f2b33d", "#ef8a5b", "#7f9cf0", "#c58af0", "#f07fa8", "#5cc4f0", "#e8d36a", "#f0a07f", "#a3a8ff", "#ff9e6b"];
  const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M15 5l-7 7 7 7"/></svg>';

  // ---------- theme ----------
  const SWATCHES = [
    ["Gold", "#f5c518"], ["Orange", "#ff8a1f"], ["Coral", "#ff6f59"], ["Red", "#e5484d"], ["Pink", "#f06aa8"], ["Purple", "#a77bf3"],
    ["Blue", "#4c8dff"], ["Sky", "#38bdf8"], ["Teal", "#2ec4b6"], ["Green", "#3fc46a"], ["Lime", "#b5e04a"], ["White", "#e9e9e9"],
  ];
  const BACKGROUNDS = [
    ["Charcoal", "#17181b"], ["Black", "#000000"], ["Navy", "#0e1322"], ["Slate", "#1e2530"], ["Plum", "#1f1428"], ["Maroon", "#2a1215"],
    ["Forest", "#10201a"], ["Espresso", "#211a15"], ["Steel", "#3a4250"], ["Cream", "#f4efe3"], ["Light", "#f3f2ef"], ["White", "#ffffff"],
  ];
  const OLD_BGS = { charcoal: "#17181b", black: "#000000", navy: "#0e1322", light: "#f3f2ef" };
  const DEFAULT_THEME = { accent: "#f5c518", bgColor: "#17181b" };
  const isHex = (v) => typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v);
  let theme = { ...DEFAULT_THEME };
  try {
    const t = JSON.parse(localStorage.getItem("mp-theme") || "null");
    if (t && isHex(t.accent)) theme.accent = t.accent;
    if (t && isHex(t.bgColor)) theme.bgColor = t.bgColor; else if (t && OLD_BGS[t.bg]) theme.bgColor = OLD_BGS[t.bg];
  } catch (e) {}
  let themeTab = "primary";

  const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const toHex = (c) => "#" + c.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");
  const mix = (a, b, t) => { const x = rgb(a), y = rgb(b); return toHex(x.map((v, i) => v + (y[i] - v) * t)); };
  function lum(hex) {
    const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    const [r, g, b] = rgb(hex); return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  }
  const inkFor = (hex) => (lum(hex) > 0.36 ? "#15130c" : "#ffffff");
  function paletteFor(bg) {
    if (lum(bg) < 0.3) {
      const fg = "#f0efea";
      return { bg, surface: mix(bg, "#ffffff", 0.06), raised: mix(bg, "#ffffff", 0.11), line: mix(bg, "#ffffff", 0.17), fg, muted: mix(fg, bg, 0.42),
        danger: "#ff6b5e", soon: "#f5b941", done: "#9fb4ff", scheme: "dark" };
    }
    const fg = "#1c1b19";
    return { bg, surface: lum(bg) > 0.9 ? mix(bg, "#000000", 0.035) : mix(bg, "#ffffff", 0.55), raised: mix(bg, "#000000", 0.06), line: mix(bg, "#000000", 0.14), fg, muted: mix(fg, bg, 0.45),
      danger: "#c8321f", soon: "#a8660a", done: "#3b5bd6", scheme: "light" };
  }
  function applyTheme() {
    const p = paletteFor(theme.bgColor), s = document.documentElement.style;
    ["bg", "surface", "raised", "line", "fg", "muted", "danger", "soon", "done"].forEach((k) => s.setProperty("--" + k, p[k]));
    s.setProperty("--accent", theme.accent);
    s.setProperty("--accent-ink", inkFor(theme.accent));
    s.setProperty("color-scheme", p.scheme);
  }
  function saveTheme() { try { localStorage.setItem("mp-theme", JSON.stringify(theme)); } catch (e) {} }
  applyTheme();

  // ---------- state ----------
  let items = [];
  let col = null, assets = null, downloads = null;
  let tab = "up";
  let hw = [], hwCol = null, showAllDone = false;
  let view = new Date(); view.setDate(1);
  let selDay = null;
  let screen = null; // {kind:'detail'|'form', id, mode, date}

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- dates ----------
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

      <div class="list">${termRow}${dayList.map(cardHtml).join("") || (termRow ? "" : `<div class="empty">Nothing due this day.</div>`)}
      <button class="addpdf" type="button" id="addOnDay">+ Add on ${esc(shortDate(day))}</button></div>`;
  }

  function renderDone() {
    const done = items.filter(isDone).sort((a, b) => b.due.localeCompare(a.due));
    return `<div class="screen-title">Finished &amp; past</div>` + (done.length ? `<div class="list">${done.map(cardHtml).join("")}</div>`
      : `<div class="empty"><strong>Nothing finished yet</strong>Set an assessment to Submitted or Marked and it shows up here. Past events show up here too.</div>`);
  }

  // ---------- grades ----------
  function renderGrades() {
    const res = items.filter((a) => !isEvent(a) && (pctOf(a) != null || a.grade)).sort((x, y) => y.due.localeCompare(x.due));
    const withPct = res.filter((a) => pctOf(a) != null);
    const avg = (list) => list.length ? list.reduce((sum, a) => sum + pctOf(a), 0) / list.length : null;
    const cur = currentTerm();
    const yr = +todayStr().slice(0, 4);
    const termList = withPct.filter((a) => +a.due.slice(0, 4) === cur.year && termOf(a) === cur.n);
    const yearList = withPct.filter((a) => +a.due.slice(0, 4) === yr);
    const stat = (label, list, main) => `<div class="stat ${main ? "main" : ""}"><span class="k">${label}</span><b>${list.length ? fmtPct(avg(list)) : "–"}</b><small>${list.length} result${list.length === 1 ? "" : "s"}</small></div>`;
    let html = `<div class="screen-title">Grades</div>`;
    if (!res.length) {
      return html + `<div class="stats">${stat("Term " + cur.n, [], true)}${stat(String(yr), [])}${stat("Overall", [])}</div>
        <div class="empty" style="margin-top:14px"><strong>No results yet</strong>Open a marked assessment and type your score, like 80% or 18/20, then tap the grade letter. Your averages show up here.</div>
        <button class="addpdf" type="button" id="addResult">+ Add a past result</button>`;
    }
    const firstDue = withPct.length ? withPct[withPct.length - 1].due : null;
    html += `<div class="stats">${stat("Term " + cur.n + (cur.year !== yr ? " " + cur.year : ""), termList, true)}${stat(String(yr), yearList)}${stat("Overall", withPct)}</div>`;
    html += `<p class="statnote">${firstDue ? "Overall is every result since " + esc(parse(firstDue).toLocaleDateString("en-AU", { month: "long", year: "numeric" })) + "." : ""}${res.length > withPct.length ? " Results with only a letter grade aren’t in the % averages." : ""}</p>`;
    html += `<div class="group-label"><span>${yr} by term</span></div><div class="terms4">${[1, 2, 3, 4].map((n) => {
      const l = yearList.filter((a) => termOf(a) === n);
      return `<div class="${cur.year === yr && cur.n === n ? "cur" : ""}"><span>Term ${n}</span><b>${l.length ? fmtPct(avg(l)) : "–"}</b></div>`;
    }).join("")}</div>`;
    const counts = {}; res.forEach((a) => { if (a.grade) counts[a.grade] = (counts[a.grade] || 0) + 1; });
    const gks = Object.keys(counts).sort();
    if (gks.length) html += `<div class="group-label"><span>Grades</span></div><div class="dist">${gks.map((g) => `<span><b>${esc(g)}</b>× ${counts[g]}</span>`).join("")}</div>`;
    const bySub = new Map();
    withPct.forEach((a) => { const k = subjKey(a.subject); if (!bySub.has(k)) bySub.set(k, { name: a.subject.trim(), list: [] }); bySub.get(k).list.push(a); });
    const subs = [...bySub.values()].map((x) => ({ ...x, avg: avg(x.list) })).sort((x, y) => y.avg - x.avg);
    if (subs.length) html += `<div class="group-label"><span>By subject</span></div><div class="list">${subs.map((x) => `<div class="subjavg">
        <span class="nm"><i style="background:${subjectColor(x.name)}"></i><span>${esc(x.name)}</span></span>
        <span class="v">${fmtPct(x.avg)}<small>${x.list.length} result${x.list.length === 1 ? "" : "s"}</small></span>
        <span class="bar"><i style="width:${Math.max(2, Math.min(100, x.avg))}%;background:${subjectColor(x.name)}"></i></span></div>`).join("")}</div>`;
    html += `<div class="group-label"><span>All results</span><span>${res.length}</span></div><div class="list">${res.map(cardHtml).join("")}</div>
      <button class="addpdf" type="button" id="addResult">+ Add a past result</button>`;
    return html;
  }

  // ---------- term dates screen ----------
  function openTerms(year) { screen = { kind: "terms", year: year || +todayStr().slice(0, 4) }; $("screenLayer").hidden = false; renderScreen(); }
  function renderTermsScreen() {
    const y = screen.year;
    const ts = termsFor(y) || [{}, {}, {}, {}];
    const usingNsw = !termsCustom(y) && !!NSW_TERMS[String(y)];
    const sc = $("screen");
    sc.innerHTML = `
      <div class="s-bar"><button class="textbtn left" type="button" data-close>Cancel</button>
        <span class="s-ttl">Term dates</span><span style="min-width:60px"></span></div>
      <form class="edit" id="termForm" novalidate>
      <div class="s-body">
        <div class="yearsw"><button class="round sm" type="button" id="tyPrev" aria-label="Previous year">‹</button><b>${y}</b><button class="round sm" type="button" id="tyNext" aria-label="Next year">›</button></div>
        <p class="saved" style="margin:0;text-align:center">${usingNsw ? "These are the NSW school term dates. Change any that are different at your school." : termsCustom(y) ? "These are your saved term dates." : "Type in the first and last day of each term."}</p>
        ${[0, 1, 2, 3].map((i) => {
          const t = ts[i] || {};
          const wks = t.start && t.end ? Math.ceil((Math.round((parse(t.end) - parse(t.start)) / 86400000) + 1) / 7) : 0;
          return `<div class="termblock"><div class="tb-h">Term ${i + 1}${wks ? `<small>about ${wks} weeks</small>` : ""}</div>
            <div class="f2"><label class="f">First day<input type="date" id="ts${i}" value="${esc(t.start || "")}"></label>
            <label class="f">Last day<input type="date" id="te${i}" value="${esc(t.end || "")}"></label></div></div>`;
        }).join("")}
        <div class="err" id="tErr"></div>
        ${NSW_TERMS[String(y)] && !usingNsw ? `<button class="btn" type="button" id="tReset">Go back to the NSW dates</button>` : ""}
      </div>
      <div class="s-foot"><button class="btn primary" type="submit" id="tSave">Save ${y} term dates</button></div>
      </form>`;
    $("tyPrev").onclick = () => { screen.year = y - 1; renderScreen(); };
    $("tyNext").onclick = () => { screen.year = y + 1; renderScreen(); };
    const persist = async (next) => {
      termData = next; renderMain();
      if (termRef) await termRef.set({ years: termData });
    };
    if ($("tReset")) $("tReset").onclick = async () => {
      const next = { ...termData }; delete next[String(y)];
      try { await persist(next); toast("Using the NSW dates for " + y); renderScreen(); } catch (e) { $("tErr").textContent = "Couldn’t save. Check your connection and try again."; }
    };
    $("termForm").onsubmit = async (e) => {
      e.preventDefault();
      const arr = [0, 1, 2, 3].map((i) => ({ start: $("ts" + i).value, end: $("te" + i).value }));
      for (let i = 0; i < 4; i++) {
        const t = arr[i];
        if (!t.start || !t.end) { $("tErr").textContent = `Fill in the first and last day of Term ${i + 1}.`; return; }
        if (t.end < t.start) { $("tErr").textContent = `Term ${i + 1} ends before it starts. Check the dates.`; return; }
        if (i && t.start <= arr[i - 1].end) { $("tErr").textContent = `Term ${i + 1} starts before Term ${i} ends. Check the dates.`; return; }
      }
      const btn = $("tSave"); btn.disabled = true; btn.textContent = "Saving…";
      try { await persist({ ...termData, [String(y)]: arr }); closeScreen(); toast("Term dates saved"); }
      catch (err) { btn.disabled = false; btn.textContent = "Save " + y + " term dates"; $("tErr").textContent = "Couldn’t save. Check your connection and try again."; }
    };
  }

  // ---------- diary ----------
  const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  function hwDue(h) {
    if (h.done) return { cls: "done", big: "✓", small: "done" };
    const n = daysUntil(h.due);
    if (n < 0) return { cls: "late", big: Math.abs(n) + "d", small: "late" };
    if (n === 0) return { cls: "soon", big: "Today", small: "due" };
    if (n === 1) return { cls: "soon", big: "Tmrw", small: "due" };
    return { cls: n <= 3 ? "soon" : "", big: n + "d", small: shortDate(h.due) };
  }
  function hwRow(h) {
    const w = hwDue(h);
    return `<div class="hw ${h.done ? "isdone" : ""}">
      <button class="tick" type="button" data-hwtick="${esc(h.id)}" aria-label="${h.done ? "Mark as not done" : "Mark as done"}" aria-pressed="${!!h.done}">${TICK}</button>
      <button class="hw-body" type="button" data-hwopen="${esc(h.id)}">
        <span class="hw-sub"><i style="background:${subjectColor(h.subject)}"></i><span>${esc(h.subject)}</span></span>
        <span class="hw-what">${esc(h.task)}</span>
        <span class="hw-dates">Got ${esc(shortDate(h.given))} · Due ${esc(parse(h.due).toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" }))}</span>
      </button>
      <span class="when ${w.cls}"><b>${esc(w.big)}</b>${esc(w.small)}</span></div>`;
  }
  function renderDiary() {
    const todo = hw.filter((h) => !h.done).sort((a, b) => a.due.localeCompare(b.due) || a.given.localeCompare(b.given));
    const done = hw.filter((h) => h.done).sort((a, b) => b.due.localeCompare(a.due));
    const late = todo.filter((h) => daysUntil(h.due) < 0);
    const soon = todo.filter((h) => { const n = daysUntil(h.due); return n >= 0 && n <= 1; });
    const later = todo.filter((h) => daysUntil(h.due) > 1);
    const group = (label, list, cls) => list.length ? `<div class="group-label ${cls || ""}"><span>${label}</span><span>${list.length}</span></div><div class="list">${list.map(hwRow).join("")}</div>` : "";
    let html = `<div class="screen-title">Homework diary</div>`;
    if (!hw.length) return html + `<div class="empty"><strong>No homework logged</strong>Tap the + button to write down homework when you get it.</div>`;
    if (!todo.length) html += `<div class="empty"><strong>All done</strong>No homework left to do. Tap + when you get more.</div>`;
    html += group("Late", late, "late") + group("Due today & tomorrow", soon) + group("Coming up", later);
    if (done.length) {
      const shown = showAllDone ? done : done.slice(0, 5);
      html += `<div class="group-label"><span>Done</span><span>${done.length}</span></div><div class="list">${shown.map(hwRow).join("")}</div>`;
      if (done.length > 5) html += `<button class="showmore" type="button" id="hwMore">${showAllDone ? "Show less" : "Show all " + done.length + " done"}</button>`;
    }
    return html;
  }
  async function saveHw(id, data) {
    if (hwCol) await hwCol.doc(id).set(data);
    const i = hw.findIndex((x) => x.id === id);
    if (i >= 0) hw[i] = { id, ...data }; else hw.push({ id, ...data });
    renderMain();
  }
  async function toggleHw(id) {
    const h = hw.find((x) => x.id === id); if (!h) return;
    const done = !h.done; h.done = done; renderMain();
    try { if (hwCol) await hwCol.doc(id).update({ done }); if (done) toast("Ticked off"); }
    catch (e) { h.done = !done; renderMain(); toast("Couldn’t save. Try again."); }
  }

  function renderHwForm() {
    const editing = screen.mode === "edit";
    const tomorrow = (() => { const d = new Date(); d.setDate(d.getDate() + 1); return ymd(d); })();
    const h = editing ? hw.find((x) => x.id === screen.id) : { given: todayStr(), due: tomorrow };
    if (!h) return closeScreen();
    const subjects = [...new Set([...hw.map((x) => x.subject), ...items.map((x) => x.subject)].filter(Boolean))];
    const sc = $("screen");
    sc.innerHTML = `
      <div class="s-bar"><button class="textbtn left" type="button" data-close>Cancel</button>
        <span class="s-ttl">${editing ? "Edit homework" : "New homework"}</span><span style="min-width:60px"></span></div>
      <form class="edit" id="hwForm" novalidate>
      <div class="s-body">
        <label class="f">Subject<input type="text" id="hSubject" list="hSubjList" value="${esc(h.subject || "")}" placeholder="e.g. English" autocomplete="off"></label>
        <label class="f">What is it?<textarea id="hTask" placeholder="e.g. Read chapter 4 and answer questions 1–6" style="min-height:110px">${esc(h.task || "")}</textarea></label>
        <div class="f2">
          <label class="f">Day I got it<input type="date" id="hGiven" value="${esc(h.given)}"></label>
          <label class="f">Day it’s due<input type="date" id="hDue" value="${esc(h.due)}"></label>
        </div>
        <datalist id="hSubjList">${subjects.map((x) => `<option value="${esc(x)}">`).join("")}</datalist>
        <div class="err" id="hErr"></div>
        ${editing ? `<div id="hwConfirm"><button class="btn danger" type="button" id="hwDel">Delete homework</button></div>` : ""}
      </div>
      <div class="s-foot"><button class="btn primary" type="submit" id="hSubmit">${editing ? "Save changes" : "Add to diary"}</button></div>
      </form>`;
    $("hwForm").onsubmit = async (e) => {
      e.preventDefault();
      const data = { subject: $("hSubject").value.trim(), task: $("hTask").value.trim(), given: $("hGiven").value, due: $("hDue").value };
      if (!data.subject || !data.task || !data.given || !data.due) { $("hErr").textContent = "Fill in the subject, what it is, and both dates."; return; }
      if (data.due < data.given) { $("hErr").textContent = "The due date is before the day you got it. Check the dates."; return; }
      const btn = $("hSubmit"); const label = btn.textContent; btn.disabled = true; btn.textContent = "Saving…";
      try {
        if (editing) { const { id: _omit, ...prev } = h; await saveHw(h.id, { ...prev, ...data, done: !!h.done }); toast("Saved"); }
        else { const id = "h" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await saveHw(id, { ...data, done: false, created: new Date().toISOString() }); toast("Added to diary"); }
        closeScreen();
      } catch (err) { btn.disabled = false; btn.textContent = label; $("hErr").textContent = "Couldn’t save. Check your connection and try again."; }
    };
    if (editing) $("hwDel").onclick = () => {
      $("hwConfirm").innerHTML = `<div class="confirm"><span>Delete this homework? This can’t be undone.</span><div class="btns"><button class="btn" type="button" id="hwNo">Keep it</button><button class="btn danger" type="button" id="hwYes">Delete</button></div></div>`;
      $("hwNo").onclick = () => renderScreen();
      $("hwYes").onclick = async () => {
        try { if (hwCol) await hwCol.doc(h.id).delete(); hw = hw.filter((x) => x.id !== h.id); closeScreen(); renderMain(); toast("Deleted"); }
        catch (err) { $("hErr").textContent = "Couldn’t delete. Try again."; }
      };
    };
    if (!editing) setTimeout(() => $("hSubject") && $("hSubject").focus(), 60);
  }

  let notice = "";
  function renderMain() {
    $("todayLbl").textContent = new Date().toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" });
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false"));
    const upCount = items.filter((a) => !isDone(a) && daysUntil(a.due) >= 0 && daysUntil(a.due) <= 7).length;
    $("upBadge").hidden = !upCount; $("upBadge").textContent = upCount;
    const keepScroll = $("main").scrollTop;
    const hwCount = hw.filter((h) => !h.done && daysUntil(h.due) <= 1).length;
    $("hwBadge").hidden = !hwCount; $("hwBadge").textContent = hwCount;
    $("fab").setAttribute("aria-label", tab === "diary" ? "Add homework" : "Add something");
    $("main").innerHTML = (tab === "up" ? renderUpcoming() : tab === "cal" ? renderCalendar() : tab === "diary" ? renderDiary() : tab === "grades" ? renderGrades() : renderDone()) + notice;
    if ($("addResult")) $("addResult").onclick = () => { screen = { kind: "form", mode: "new", ekind: "assessment", preset: { status: "Marked" } }; $("screenLayer").hidden = false; renderScreen(); };
    $("main").scrollTop = keepScroll;
    if (tab === "cal") {
      $("prevM").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderMain(); };
      $("nextM").onclick = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderMain(); };
      $("todayBtn").onclick = () => { const n = new Date(); view = new Date(n.getFullYear(), n.getMonth(), 1); selDay = todayStr(); renderMain(); };
      $("addOnDay").onclick = () => openAdd(selDay || todayStr());
    }
    if ($("goRestore")) $("goRestore").onclick = () => { themeTab = "primary"; openTheme(); setTimeout(() => { const d = document.querySelector(".datasec"); if (d) d.scrollIntoView({ block: "end" }); }, 50); };
    if (tab === "diary" && $("hwMore")) $("hwMore").onclick = () => { showAllDone = !showAllDone; renderMain(); };
    if (screen && screen.kind === "detail" && !$("screen").contains(document.activeElement)) renderScreen();
  }

  // ---------- screens ----------
  function openDetail(id) { screen = { kind: "detail", id }; $("screenLayer").hidden = false; renderScreen(); }
  function openForm(mode, date, id, ekind) { screen = { kind: "form", mode, date, id, ekind }; $("screenLayer").hidden = false; renderScreen(); }
  function closeScreen() { screen = null; $("screenLayer").hidden = true; $("screen").innerHTML = ""; }
  function renderScreen() {
    if (!screen) return;
    if (screen.kind === "form") return renderForm();
    if (screen.kind === "hwform") return renderHwForm();
    if (screen.kind === "terms") return renderTermsScreen();
    const a = items.find((x) => x.id === screen.id);
    if (!a) return closeScreen();
    renderDetail(a);
  }

  function renderDetail(a) {
    const w = whenInfo(a);
    const sc = $("screen");
    const n = daysUntil(a.due);
    const files = (a.files || []).map((f) => `<div class="file"><span class="ico">PDF</span><button type="button" class="open" data-pdf="${esc(f.id)}" data-name="${esc(f.name)}">${esc(f.name)}</button>${assets ? `<button type="button" class="x" data-rmfile="${esc(f.id)}" aria-label="Remove ${esc(f.name)}">×</button>` : ""}</div>`).join("");
    let countBig = w.cls === "done" ? (a.status === "Marked" ? (pctOf(a) != null ? fmtPct(pctOf(a)) : esc(a.grade || a.mark || "Done")) : "Done") : w.cls === "late" ? Math.abs(n) + " days" : n === 0 ? "Today" : n + (n === 1 ? " day" : " days");
    let countSmall = w.cls === "done" ? (a.status === "Marked" && a.grade && pctOf(a) != null ? "Grade " + a.grade : a.status) : w.cls === "late" ? "overdue" : n === 0 ? "it’s due" : "to go";
    const ev = isEvent(a);
    if (ev) {
      const ne = daysUntil(evEnd(a));
      if (ne < 0) { countBig = "Past"; countSmall = "this has happened"; }
      else if (n < 0 || (n === 0 && ne > 0)) { countBig = "On now"; countSmall = "until " + shortDate(evEnd(a)); }
      else if (n === 0) { countBig = "Today"; countSmall = a.time || ""; }
      else { countBig = n + (n === 1 ? " day" : " days"); countSmall = "to go"; }
    }
    const factsHtml = ev ? `
        <div class="facts">
          <div class="fact" style="grid-column:1/-1"><span>${evEnd(a) !== a.due ? "Dates" : "Date"}</span><b>${esc(dateRange(a))}</b></div>
          <div class="fact"><span>Time</span><b>${esc(a.time || "—")}</b></div>
          <div class="fact"><span>Location</span><b>${esc(a.location || "—")}</b></div>
        </div>
        ${a.bring ? `<div><div class="label">What to bring</div><div class="desc">${esc(a.bring)}</div></div>` : ""}` : `
        <div class="facts">
          <div class="fact"><span>Due</span><b>${niceDate(a.due)}</b></div>
          <div class="fact"><span>Type</span><b>${esc(a.type || "—")}</b></div>
          <div class="fact"><span>Weighting</span><b class="mono">${a.weight ? esc(a.weight) + "%" : "—"}</b></div>
          <div class="fact"><span>Teacher</span><b>${esc(a.teacher || "—")}</b></div>
        </div>
        <div><div class="label">Status</div>
          <div class="seg" role="group" aria-label="Status">${STATUSES.map((s) => `<button type="button" data-status="${s}" aria-pressed="${s === a.status}">${s === "Not started" ? "To do" : s}</button>`).join("")}</div></div>
        <div><div class="label"><span>Result</span><span class="hint">Term ${termOf(a)}, ${a.due.slice(0, 4)}</span></div>
          <div class="scoreline"><input type="text" id="markIn" inputmode="decimal" value="${esc(a.score ?? a.mark ?? "")}" placeholder="Score, e.g. 80% or 18/20"><span class="pct" id="pctOut">${pctOf(a) != null ? fmtPct(pctOf(a)) : ""}</span></div>
          <div class="label" style="margin-top:12px">Grade</div>
          <div class="gradechips" role="group" aria-label="Grade">${GRADES.map((g) => `<button type="button" class="gch" data-grade="${g}" aria-pressed="${a.grade === g}">${g}</button>`).join("")}</div>
          <div class="err" id="markErr" style="margin-top:6px"></div></div>`;
    sc.innerHTML = `
      <div class="s-bar"><button class="textbtn left" type="button" data-close aria-label="Back" style="display:flex;align-items:center;gap:2px">${ICON_BACK}Back</button>
        <span class="s-ttl"></span><button class="textbtn right" type="button" id="editBtn">Edit</button></div>
      <div class="s-body">
        <div class="d-top">
          ${ev ? `<span class="pill"><span class="dot" style="background:${itemColor(a)}"></span>${esc(a.category || "Event")}</span>` : `<span class="pill"><span class="dot" style="background:${subjectColor(a.subject)}"></span>${esc(a.subject)}</span>`}
          <h2>${esc(a.title)}</h2>
          <div class="count ${w.cls}"><b>${countBig}</b><span>${esc(countSmall)}</span></div>
        </div>
${factsHtml}
        ${a.details ? `<div><div class="label">${ev ? "Details" : "Task details"}</div><div class="desc">${esc(a.details)}</div></div>` : ""}
        <div>
          <div class="label">${ev ? "Attachments (PDF)" : "Assessment notification (PDF)"}</div>
          <div class="files">${files}</div>
          ${assets ? `<label class="addpdf fpick" id="drop"><span id="dropTxt">+ Attach PDF from device</span><input type="file" id="pdfIn" accept="application/pdf,.pdf" multiple aria-label="Attach PDF from device"></label><div class="err" id="upMsg" style="margin-top:6px"></div>`
            : (files ? "" : `<div class="desc" style="color:var(--muted)">Open this app in Claude while signed in to attach PDFs.</div>`)}
        </div>

      </div>`;

    sc.querySelectorAll("[data-status]").forEach((b) => (b.onclick = () => {
      const st = b.dataset.status; b.blur();
      patchItem(a.id, { status: st }).then(() => { renderScreen(); toast(st === "Submitted" || st === "Marked" ? "Nice one! Moved to Done" : "Status updated"); });
    }));
    if ($("markIn")) {
      $("markIn").oninput = (e) => { const v = parseScore(e.target.value); $("pctOut").textContent = v != null ? fmtPct(v) : ""; $("markErr").textContent = ""; };
      $("markIn").onchange = (e) => {
        const v = e.target.value.trim();
        const pc = parseScore(v);
        if (v && pc == null) { $("markErr").textContent = "Type a percentage like 80 or a score like 18/20."; return; }
        e.target.blur();
        const patch = { score: v, mark: v, pct: pc };
        if (pc != null && a.status !== "Marked") patch.status = "Marked";
        patchItem(a.id, patch).then(() => { renderScreen(); toast(pc != null ? "Result saved" : "Result cleared"); }).catch(() => { $("markErr").textContent = "Couldn’t save. Try again."; });
      };
    }
    sc.querySelectorAll("[data-grade]").forEach((b) => (b.onclick = () => {
      const g = a.grade === b.dataset.grade ? "" : b.dataset.grade;
      const patch = { grade: g };
      if (g && a.status !== "Marked") patch.status = "Marked";
      patchItem(a.id, patch).then(() => { renderScreen(); toast(g ? "Grade " + g + " saved" : "Grade cleared"); });
    }));
    let nt;
    $("notesIn").oninput = (e) => {
      $("savedMsg").textContent = "Saving…"; clearTimeout(nt);
      nt = setTimeout(async () => {
        try { if (col) await col.doc(a.id).update({ notes: e.target.value }); const it = items.find((x) => x.id === a.id); if (it) it.notes = e.target.value; $("savedMsg").textContent = "Saved"; }
        catch (err) { $("savedMsg").textContent = "Couldn’t save. Keep typing to retry."; }
      }, 700);
    };
    $("editBtn").onclick = () => openForm("edit", null, a.id);
    $("delBtn").onclick = () => {
      $("confirmBox").innerHTML = `<div class="confirm"><span>Delete “${esc(a.title)}” and its PDFs? This can’t be undone.</span><div class="btns"><button class="btn" type="button" id="noDel">Keep it</button><button class="btn danger" type="button" id="yesDel">Delete</button></div></div>`;
      $("noDel").onclick = () => renderScreen();
      $("yesDel").onclick = async () => { await removeItem(a.id); closeScreen(); toast("Deleted"); };
    };
    sc.querySelectorAll("[data-rmfile]").forEach((b) => (b.onclick = async () => {
      const fid = b.dataset.rmfile;
      try { await assets.delete(fid); } catch (e) {}
      const cur = items.find((x) => x.id === a.id) || a;
      await patchItem(a.id, { files: (cur.files || []).filter((f) => f.id !== fid) });
      renderScreen(); toast("PDF removed");
    }));
    if (assets) {
      const drop = $("drop");
      const handle = async (list) => {
        const chosen = [...list]; if (!chosen.length) return;
        const pdfs = chosen.filter((f) => f.type === "application/pdf" || /\.pdf$/i.test(f.name));
        if (!pdfs.length) { $("upMsg").textContent = "Only PDF files can be attached."; return; }
        const added = [];
        try {
          for (let i = 0; i < pdfs.length; i++) {
            $("dropTxt").textContent = `Uploading ${i + 1} of ${pdfs.length}…`;
            const r = await assets.upload(pdfs[i], { type: "application/pdf" });
            added.push({ id: r.id, name: pdfs[i].name });
          }
        } catch (e) {
          $("upMsg").textContent = e && e.code === "too_large" ? "That PDF is over 20 MB. Try a smaller copy." : "Upload failed. Check your connection and try again.";
        }
        if (added.length) {
          const cur = items.find((x) => x.id === a.id) || a;
          await patchItem(a.id, { files: [...(cur.files || []), ...added] });
          if (document.activeElement) document.activeElement.blur();
          renderScreen(); toast(added.length > 1 ? added.length + " PDFs attached" : "PDF attached");
        } else $("dropTxt").textContent = "+ Attach PDF from device";
      };
      $("pdfIn").onchange = (e) => handle(e.target.files);
      drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
      drop.ondragleave = () => drop.classList.remove("over");
      drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); handle(e.dataTransfer.files); };
    }
  }

  // ---------- backup & restore ----------
  async function getBlob(id) {
    if (assets && assets.get) return assets.get(id);
    const res = await fetch("/_blob/" + encodeURIComponent(id));
    if (!res.ok) throw new Error("http " + res.status);
    return res.blob();
  }
  const blobToDataUrl = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
  function dataUrlToBlob(u, type) {
    const i = u.indexOf(","); const bin = atob(u.slice(i + 1)); const arr = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
    return new Blob([arr], { type: type || "application/pdf" });
  }
  async function makeBackup(progress) {
    const files = {}; let missing = 0;
    const ids = []; items.forEach((a) => (a.files || []).forEach((f) => ids.push(f)));
    for (let i = 0; i < ids.length; i++) {
      progress && progress(`Packing PDF ${i + 1} of ${ids.length}…`);
      try { const b = await getBlob(ids[i].id); files[ids[i].id] = { name: ids[i].name, type: b.type || "application/pdf", data: await blobToDataUrl(b) }; }
      catch (e) { missing++; }
    }
    return { backup: { app: "de-la-tracker", v: 1, exported: new Date().toISOString(), assessments: items, homework: hw, settings: { colors: { subjects: subjColors }, terms: { years: termData } }, files }, missing };
  }
  async function restoreBackup(obj, progress) {
    const idMap = {}; let skipped = 0;
    const fe = Object.entries(obj.files || {});
    for (let i = 0; i < fe.length; i++) {
      const [fid, f] = fe[i];
      if (!assets) { skipped++; continue; }
      progress && progress(`Restoring PDF ${i + 1} of ${fe.length}…`);
      try { const r = await assets.upload(dataUrlToBlob(f.data, f.type), { type: f.type || "application/pdf" }); idMap[fid] = r.id; } catch (e) { skipped++; }
    }
    progress && progress("Restoring your assessments…");
    for (const a of obj.assessments || []) {
      if (!a || !a.id || !a.due) continue;
      const { id, ...rest } = a;
      rest.files = (rest.files || []).filter((x) => idMap[x.id]).map((x) => ({ ...x, id: idMap[x.id] }));
      if (col) await col.doc(id).set(rest);
    }
    for (const h of obj.homework || []) { if (!h || !h.id) continue; const { id, ...rest } = h; if (hwCol) await hwCol.doc(id).set(rest); }
    const st = obj.settings || {};
    if (st.colors && st.colors.subjects && colorRef) await colorRef.set({ subjects: { ...subjColors, ...st.colors.subjects } });
    if (st.terms && st.terms.years && termRef) await termRef.set({ years: { ...termData, ...st.terms.years } });
    return { count: (obj.assessments || []).length + (obj.homework || []).length, skipped };
  }
  function bindBackup() {
    const msg = (t) => { if ($("bkMsg")) $("bkMsg").textContent = t; };
    let ready = null;
    $("bkOut").onclick = async () => {
      const btn = $("bkOut");
      if (!downloads) { msg("Saving files isn’t available here."); return; }
      if (ready) {
        const { blob, name, missing } = ready;
        try {
          const r = await downloads.save({ filename: name, data: blob });
          if (r && r.status === "saved") { msg("Backup saved as " + name + (missing ? ` (${missing} PDF${missing === 1 ? "" : "s"} couldn’t be included)` : "") + ". On iPhone, pick Save to Files."); ready = null; btn.textContent = "Back up"; btn.classList.remove("primary"); }
          else msg("Not saved. Tap Save backup file to try again.");
        } catch (e) { msg("The backup didn’t save. Tap Save backup file to try again."); }
        return;
      }
      btn.disabled = true; btn.textContent = "Getting it ready…";
      try {
        const { backup, missing } = await makeBackup(msg);
        ready = { blob: new Blob([JSON.stringify(backup)], { type: "application/json" }), name: "de-la-tracker-backup-" + todayStr() + ".json", missing };
        btn.textContent = "Save backup file"; btn.classList.add("primary");
        msg("Your backup is ready. Tap Save backup file.");
      } catch (e) { btn.textContent = "Back up"; msg("The backup didn’t work. Try again."); }
      btn.disabled = false;
    };
    $("bkIn").onchange = async (e) => {
      const f = e.target.files[0]; e.target.value = ""; if (!f) return;
      let obj;
      try { obj = JSON.parse(await f.text()); } catch (err) { msg("That file isn’t a DE LA TRACKER backup."); return; }
      if (!obj || obj.app !== "de-la-tracker") { msg("That file isn’t a DE LA TRACKER backup."); return; }
      const n = (obj.assessments || []).length, hn = (obj.homework || []).length, pn = Object.keys(obj.files || {}).length;
      const when = obj.exported ? new Date(obj.exported).toLocaleDateString("en-AU", { day: "numeric", month: "long", year: "numeric" }) : "an earlier date";
      $("bkConfirm").innerHTML = `<div class="confirm" style="border-color:var(--line)"><span>Restore the backup from ${esc(when)}? It has ${n} assessment${n === 1 ? "" : "s"} &amp; event${n === 1 ? "" : "s"}, ${hn} homework and ${pn} PDF${pn === 1 ? "" : "s"}. Anything already in the app stays.</span><div class="btns"><button class="btn" type="button" id="bkNo">Cancel</button><button class="btn primary" type="button" id="bkYes" style="font-size:15px;padding:10px">Restore</button></div></div>`;
      $("bkNo").onclick = () => ($("bkConfirm").innerHTML = "");
      $("bkYes").onclick = async () => {
        $("bkConfirm").innerHTML = "";
        try { const r = await restoreBackup(obj, msg); msg(`Restored ${r.count} item${r.count === 1 ? "" : "s"}${r.skipped ? ` (${r.skipped} PDF${r.skipped === 1 ? "" : "s"} couldn’t be restored)` : ""}.`); toast("Backup restored"); }
        catch (err) { msg("The restore didn’t finish. Try again."); }
      };
    };
  }

  // ---------- PDF viewer ----------
  let vBlob = null, vName = "", vToken = 0;
  async function openPdf(id, name) {
    const token = ++vToken;
    vBlob = null; vName = name;
    $("vName").textContent = name; $("vInfo").textContent = ""; $("vSave").hidden = true;
    $("vPages").innerHTML = '<div class="v-msg">Opening PDF…</div>';
    $("viewer").hidden = false;
    try {
      const blob = await getBlob(id);
      if (token !== vToken) return;
      vBlob = blob; $("vSave").hidden = !downloads;
      if (!window.pdfjsLib) throw new Error("no pdfjs");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported: false }).promise;
      if (token !== vToken) return;
      $("vPages").innerHTML = "";
      $("vInfo").textContent = pdf.numPages + (pdf.numPages === 1 ? " page" : " pages");
      const width = Math.min(900, $("vPages").clientWidth - 32);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      for (let p = 1; p <= pdf.numPages; p++) {
        if (token !== vToken) return;
        const page = await pdf.getPage(p);
        const base = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: (width / base.width) * dpr });
        const c = document.createElement("canvas");
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        c.setAttribute("aria-label", "Page " + p);
        $("vPages").appendChild(c);
        await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      }
    } catch (e) {
      if (token !== vToken) return;
      $("vPages").innerHTML = '<div class="v-msg">This PDF couldn’t be shown here. ' + (vBlob && downloads ? "Use “Save a copy” to open it on your device." : "Close it and try again in a moment.") + "</div>";
    }
  }
  function closePdf() { vToken++; $("viewer").hidden = true; $("vPages").innerHTML = ""; }
  $("vClose").onclick = closePdf;
  $("vSave").onclick = async () => {
    if (!downloads || !vBlob) return;
    try { const r = await downloads.save({ filename: /\.pdf$/i.test(vName) ? vName : vName + ".pdf", data: vBlob }); if (r && r.status === "saved") toast("Saved"); }
    catch (e) { if (e && e.code === "unavailable") $("vSave").hidden = true; }
  };

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const pdfBtn = e.target.closest("[data-pdf]");
    if (pdfBtn) { openPdf(pdfBtn.dataset.pdf, pdfBtn.dataset.name); return; }
    if (e.target.closest("[data-closesheet]")) { closeTheme(); return; }
    if (e.target.closest("[data-close]")) { closeScreen(); return; }
    if (e.target.closest("[data-terms]")) { openTerms(); return; }
    const tk = e.target.closest("[data-hwtick]");
    if (tk) { toggleHw(tk.dataset.hwtick); return; }
    const ho = e.target.closest("[data-hwopen]");
    if (ho) { screen = { kind: "hwform", mode: "edit", id: ho.dataset.hwopen }; $("screenLayer").hidden = false; renderScreen(); return; }
    const o = e.target.closest("[data-open]");
    if (o) { openDetail(o.dataset.open); return; }
    const d = e.target.closest("[data-day]");
    if (d) {
      selDay = d.dataset.day;
      const dt = parse(selDay);
      if (dt.getMonth() !== view.getMonth()) view = new Date(dt.getFullYear(), dt.getMonth(), 1);
      renderMain();
    }
  });
  document.querySelectorAll(".tab").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; $("main").scrollTop = 0; renderMain(); }));
  $("fab").onclick = () => {
    if (tab === "diary") { screen = { kind: "hwform", mode: "new" }; $("screenLayer").hidden = false; renderScreen(); return; }
    openAdd(tab === "cal" ? (selDay || todayStr()) : null);
  };
  $("themeBtn").onclick = openTheme;
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("viewer").hidden) closePdf();
    else if (!$("sheetLayer").hidden) closeTheme();
    else if (screen) closeScreen();
  });

  renderMain();

  const unshift = () => { const el = document.activeElement; if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && el.type !== "file") return; if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } };
  document.addEventListener("focusout", () => setTimeout(unshift, 60));
  window.addEventListener("focus", () => setTimeout(unshift, 60));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(unshift, 60); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", () => setTimeout(unshift, 60));
  window.addEventListener("scroll", () => setTimeout(unshift, 120));

  // ---------- connect ----------
  (async () => {
    const db = window.claude ? await window.claude.use("db") : null;
    try { assets = window.claude ? await window.claude.use("assets") : null; } catch (e) { assets = null; }
    try { downloads = window.claude ? await window.claude.use("downloads") : null; } catch (e) { downloads = null; }
    if (vBlob && downloads) $("vSave").hidden = false;
    if (screen) renderScreen();
    if (!db) {
      notice = '<div class="notice">Sign in to Claude to save assessments. Anything added now stays only until you close this page.</div>';
      renderMain();
      return;
    }
    col = db.collection("assessments");
    col.onSnapshot((snap) => {
      items = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((a) => a.due);
      if (screen && screen.kind !== "detail") { const keep = screen; screen = null; renderMain(); screen = keep; }
      else renderMain();
    }, () => {
      notice = '<div class="notice">Couldn’t load your assessments. Refresh the page to try again.</div>';
      renderMain();
    });
    termRef = db.doc("settings/terms");
    termRef.onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : null;
      termData = (d && d.years && typeof d.years === "object") ? d.years : {};
      if (screen && screen.kind !== "detail") { const keep = screen; screen = null; renderMain(); screen = keep; } else renderMain();
    }, () => {});
    colorRef = db.doc("settings/colors");
    colorRef.onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : null;
      subjColors = (d && d.subjects && typeof d.subjects === "object") ? d.subjects : {};
      if (screen && screen.kind !== "detail") { const keep = screen; screen = null; renderMain(); screen = keep; } else renderMain();
    }, () => {});
    hwCol = db.collection("homework");
    hwCol.onSnapshot((snap) => {
      hw = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((h) => h.due && h.given);
      if (screen && screen.kind !== "detail") { const keep = screen; screen = null; renderMain(); screen = keep; }
      else renderMain();
    }, () => {});
  })();
})();
</script>
